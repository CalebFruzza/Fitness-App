<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PT Chatbot</title>

    <link rel="stylesheet" href="Homepage.css">
    <link rel="stylesheet" href="pt-chatbot.css">
</head>

<body>

<header>
    <img src="logo.png" alt="Fitness App Logo" class="logo" />

    <nav class="nav-links">
        <a href="Homepage.html">Home</a>
        <a href="diets.html">Diets</a>
        <a href="exercise-physical.html">Exercise & Physical</a>
        <a href="pt-chatbot.html">PT Chatbot</a>
        <a href="supplements.html">Supplements</a>
        <a href="about.html">About Us</a>
    </nav>
</header>

<main class="main-content">

<div class="chat-layout">

    <!-- ✅ SIDEBAR -->
    <div class="chat-sidebar">
        <button onclick="createNewChat()">+ New Chat</button>
        <div id="chat-list"></div>
    </div>

    <!-- ✅ CHAT AREA -->
    <section class="dashboard-card">

        <div class="dashboard-top-line"></div>
        <h1 class="dashboard-title">PT Chatbot</h1>

        <div class="chat-container">

            <div class="chat-box" id="chat-box">
                <div class="bot-message">
                    <span>Hi! I'm your PT assistant 💪 Ask me anything!</span>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="user-input" placeholder="Ask a question..." />
                <button id="send-btn">Send</button>
            </div>

        </div>

    </section>

</div>

</main>

<script>
let currentSessionId = null;

// Load chats + create first chat
window.onload = async () => {
    await createNewChat();
    await loadSessions();
};

document.getElementById("send-btn").addEventListener("click", sendMessage);

document.getElementById("user-input").addEventListener("keypress", function (e) {
    if (e.key === "Enter") sendMessage();
});

async function createNewChat() {
    const res = await fetch("/api/chat/new", {
        method: "POST"
    });

    currentSessionId = await res.text();

    document.getElementById("chat-box").innerHTML = "";

    loadSessions();
}

async function loadSessions() {
    const res = await fetch("/api/chat/sessions");
    const sessions = await res.json();

    const list = document.getElementById("chat-list");
    list.innerHTML = "";

    sessions.reverse().forEach(id => {
        const div = document.createElement("div");
        div.className = "chat-item";
        div.innerText = "Chat " + id.substring(0, 6);

        div.onclick = () => loadChat(id);

        list.appendChild(div);
    });
}

async function loadChat(sessionId) {
    currentSessionId = sessionId;

    const res = await fetch(`/api/chat/history/${sessionId}`);
    const history = await res.json();

    const chatBox = document.getElementById("chat-box");
    chatBox.innerHTML = "";

    history.forEach(msg => {
        if (msg.role === "user") addUserMessage(msg.content);
        if (msg.role === "assistant") addBotMessage(msg.content);
    });
}

async function sendMessage() {
    const input = document.getElementById("user-input");
    const message = input.value.trim();

    if (!message || !currentSessionId) return;

    addUserMessage(message);
    input.value = "";

    try {
        const res = await fetch("/api/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                message: message,
                sessionId: currentSessionId
            })
        });

        const text = await res.text();
        addBotMessage(text);

    } catch (err) {
        addBotMessage("Error connecting to server");
    }
}

function addUserMessage(text) {
    const chatBox = document.getElementById("chat-box");

    const div = document.createElement("div");
    div.className = "chat-message user-message";
    div.innerHTML = `<span>${text}</span>`;

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function addBotMessage(text) {
    const chatBox = document.getElementById("chat-box");

    const div = document.createElement("div");
    div.className = "chat-message bot-message";
    div.innerHTML = `<span>${text}</span>`;

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
